<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>날짜별 인기뉴스 AI 큐레이션</title>

  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container">
    <h1>날짜별 인기뉴스 AI 큐레이션</h1>

    <p class="description">
      날짜와 키워드를 입력하면 관련 뉴스를 수집하고 AI가 요약합니다.
    </p>

    <div class="search-area">
      <!-- 날짜 입력 -->
      <input
        type="date"
        id="dateInput"
        value="2025-01-02"
      />

      <!-- 키워드 입력 -->
      <input
        type="text"
        id="keywordInput"
        value="AI"
        placeholder="키워드를 입력하세요"
      />

      <!-- 중요: 여기에 id="searchButton" 추가 -->
      <button id="searchButton" type="button">
        뉴스 검색
      </button>
    </div>

    <section class="summary-section">
      <h2>AI 요약</h2>

      <!-- JS에서 이 영역에 요약 결과를 넣음 -->
      <div id="summaryBox">
        아직 검색하지 않았습니다.
      </div>
    </section>

    <section class="news-section">
      <h2>뉴스 목록</h2>

      <!-- JS에서 이 영역에 뉴스 목록을 넣음 -->
      <div id="newsList"></div>
    </section>
  </div>

  <!-- 중요: body 맨 아래에 JS 연결 -->
  <script src="/static/js/main.js"></script>
</body>
</html>
